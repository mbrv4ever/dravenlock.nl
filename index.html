<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dravenlock Software — Onderhoud / Maintenance</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
/* === Maintenance page === */
:root {
    --bg-app:    #111114;
    --bg-card:   #1a1a20;
    --border:    #2a2a32;
    --text:      #e8eaef;
    --text-dim:  #a0a4ad;
    --accent:    #c0c8d4;
    --accent-d:  #383a42;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    background: var(--bg-app);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    cursor: default;
}

/* Subtiele scan-line achtergrond */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(192, 200, 212, 0.012) 2px,
        rgba(192, 200, 212, 0.012) 3px
    );
    pointer-events: none;
    z-index: 1;
}

/* Vignet rondom */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        ellipse at center,
        transparent 30%,
        rgba(0, 0, 0, 0.4) 100%
    );
    pointer-events: none;
    z-index: 2;
}

.container {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
    text-align: center;
}

.logo-wrap {
    width: 140px;
    height: 140px;
    margin-bottom: 32px;
    position: relative;
    animation: fade-up 1s 0.1s both ease-out;
}

.logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

h1 {
    font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
    margin-bottom: 18px;
    animation: fade-up 1s 0.3s both ease-out;
}

h1 .accent {
    color: var(--accent);
}

.lang-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    animation: fade-up 1s 0.5s both ease-out;
}

.lang-line span {
    padding: 6px 14px;
    border: 1px solid var(--accent-d);
    border-radius: 20px;
}

.tagline {
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    line-height: 1.6;
    color: var(--text);
    max-width: 580px;
    margin-bottom: 12px;
    animation: fade-up 1s 0.7s both ease-out;
}

.tagline-en {
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    color: var(--text-dim);
    font-style: italic;
    max-width: 580px;
    margin-bottom: 48px;
    animation: fade-up 1s 0.9s both ease-out;
}

/* Animated dots loader */
.progress-bar {
    width: 240px;
    height: 3px;
    background: var(--bg-card);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    margin-bottom: 36px;
    animation: fade-up 1s 1.1s both ease-out;
}

.progress-bar::before {
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
    );
    animation: slide 2.5s ease-in-out infinite;
}

@keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
}

.contact-line {
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 0.3px;
    animation: fade-up 1s 1.3s both ease-out;
}

.contact-line a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-d);
    padding-bottom: 1px;
    transition: border-color 0.3s, color 0.3s;
}

.contact-line a:hover {
    color: var(--text);
    border-color: var(--accent);
}

.footer-mark {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-d);
    z-index: 3;
    animation: fade-up 1s 1.5s both ease-out;
}

@keyframes fade-up {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile adjustments */
@media (max-width: 480px) {
    .logo-wrap {
        width: 100px;
        height: 100px;
        margin-bottom: 24px;
    }
    .lang-line {
        gap: 8px;
        font-size: 0.75rem;
        letter-spacing: 1px;
    }
    .lang-line span {
        padding: 5px 10px;
    }
}

/* Reduced motion: respecteer accessibility preference */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01s !important;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="logo-wrap">
        <img src="logo.png" alt="Dravenlock Software">
    </div>

    <h1>Dravenlock <span class="accent">/</span> Onderhoud</h1>

    <div class="lang-line">
        <span>NL</span>
        <span>EN</span>
    </div>

    <p class="tagline">
        We werken aan iets moois. Even geduld, we zijn snel terug.
    </p>
    <p class="tagline-en">
        We&rsquo;re working on something nice. Back online shortly.
    </p>

    <div class="progress-bar"></div>

    <p class="contact-line">
        Bedankt voor je geduld &mdash; thank you for your patience.
    </p>

</div>

<div class="footer-mark">
    Made with &hearts; in the EU &mdash; Netherlands
</div>

</body>
</html>
