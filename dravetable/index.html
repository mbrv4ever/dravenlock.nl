<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DraveTable">
<title>DraveTable</title>
<style>
  :root{
    --bg:#0e0e11; --panel:#16161b; --card:#14141a; --silver:#d4d4d4;
    --mute:#8a8a94; --accent:#6fa3d6; --good:#4fb477; --warn:#e0a23a; --bad:#d6645f;
    --line:#2c2c36;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--silver);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:17px;}
  body{padding-bottom:80px;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  .wrap{max-width:680px; margin:0 auto;}

  header{position:sticky; top:0; z-index:10; background:var(--panel);
    border-bottom:1px solid #23232b; padding:10px 12px;
    display:flex; align-items:center; gap:10px;}
  header img{width:30px; height:30px; border-radius:6px; object-fit:cover;}
  header .ttl{font-size:20px; font-weight:800;}
  header .ver{color:var(--mute); font-size:12px;}
  header .sp{flex:1;}
  .iconbtn{background:var(--card); border:1px solid var(--line); border-radius:8px;
    color:var(--silver); padding:8px 10px; font-size:15px; min-height:40px;}
  .iconbtn:active{background:var(--accent); color:#08131f;}

  .pad{padding:12px;}
  .section-ttl{color:var(--mute); font-size:13px; font-weight:700;
    text-transform:uppercase; letter-spacing:1px; margin:6px 2px;}

  .turnbar{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .turnbar .who{flex:1; min-width:0;}
  .turnbar .lab{color:var(--mute); font-size:13px;}
  .turnbar .name{font-size:24px; font-weight:800; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .turnbar .round{color:var(--accent); font-weight:700; font-size:15px;}
  .bigbtn{background:var(--accent); color:#08131f; font-weight:800; border:none;
    border-radius:12px; padding:0 18px; min-height:60px; font-size:18px;}
  .bigbtn:active{background:#87b6e3;}
  .bigbtn.ghost{background:var(--card); color:var(--silver); border:1px solid var(--line);}

  .addrow{display:flex; flex-wrap:wrap; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px;}
  .addrow input{background:var(--card); border:1px solid var(--line); border-radius:8px;
    color:var(--silver); padding:10px; font-size:16px; min-height:46px;}
  .addrow .name{flex:1 1 100%;}
  .addrow .ini{flex:1 1 80px; width:80px; text-align:center;}
  .addrow .hp{flex:1 1 80px; width:80px; text-align:center;}
  .addrow .d20{background:var(--card); border:1px solid var(--line); color:var(--accent);
    border-radius:8px; font-weight:700; min-height:46px; padding:0 12px;}
  .addrow .d20:active{background:var(--accent); color:#08131f;}
  .addrow .add{flex:1 1 100%; background:var(--accent); color:#08131f; font-weight:800;
    border:none; border-radius:10px; min-height:50px; font-size:17px;}
  .addrow .add:active{background:#87b6e3;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-bottom:10px;}
  .card.active{border-color:var(--accent); box-shadow:0 0 0 2px rgba(111,163,214,.35);}
  .card.down{opacity:.55;}
  .card .top{display:flex; align-items:center; gap:10px;}
  .card .ini{background:var(--panel); border:1px solid var(--line); border-radius:8px;
    min-width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:20px; color:var(--accent); flex:0 0 auto;}
  .card .nm{flex:1; min-width:0;}
  .card .nm .n{font-size:19px; font-weight:700; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;}
  .card .nm .badge{display:inline-block; background:#3a1418; color:var(--bad);
    border:1px solid #5a1f25; border-radius:6px; font-size:12px; padding:1px 7px;
    margin-top:3px; font-weight:700;}
  .card .hpbox{text-align:right;}
  .card .hpbox .hp{font-size:22px; font-weight:800;}
  .card .hpbox .mx{color:var(--mute); font-size:13px;}
  .card .del{background:transparent; border:none; color:var(--mute); font-size:22px;
    padding:4px 6px; min-height:40px;}
  .hprow{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .hprow .amt{width:64px; text-align:center; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; color:var(--silver);
    padding:8px; font-size:18px; min-height:48px;}
  .hprow .dmg,.hprow .heal{flex:1; min-height:48px; border-radius:10px; border:none;
    font-weight:800; font-size:16px;}
  .hprow .dmg{background:#3a1418; color:#f0a9a4; border:1px solid #5a1f25;}
  .hprow .dmg:active{background:var(--bad); color:#1a0a0b;}
  .hprow .heal{background:#10301f; color:#9fe0bb; border:1px solid #1c4a30;}
  .hprow .heal:active{background:var(--good); color:#062013;}
  .noterow{margin-top:8px;}
  .noterow input{width:100%; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; color:var(--silver); padding:8px 10px; font-size:14px; min-height:42px;}

  .empty{color:var(--mute); text-align:center; padding:30px 10px; font-size:16px;}

  footer{position:fixed; bottom:0; left:0; right:0; background:var(--panel);
    border-top:1px solid #23232b; padding:8px 12px; display:flex; align-items:center; gap:10px;}
  footer .sp{flex:1;}
  footer button{background:var(--card); border:1px solid var(--line); color:var(--silver);
    border-radius:8px; padding:8px 12px; min-height:44px; font-size:14px;}
  footer .donate{border:none; background:transparent; color:var(--accent);}
  footer .reset:active{background:var(--bad); color:#1a0a0b;}

  /* dialoog */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal.on{display:flex;}
  .sheet{background:var(--bg); border:1px solid var(--line); border-radius:14px;
    max-width:560px; width:100%; max-height:85vh; overflow:auto; padding:16px;}
  .sheet h2{margin:0 0 8px; font-size:20px;}
  .sheet p,.sheet li{line-height:1.5; color:var(--silver);}
  .sheet .close{margin-top:12px; width:100%; background:var(--accent); color:#08131f;
    border:none; border-radius:10px; min-height:50px; font-weight:800; font-size:16px;}
  .sheet a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="Dravenlock">
    <span class="ttl">DraveTable</span>
    <span class="ver" id="ver">v1.0</span>
    <span class="sp"></span>
    <button class="iconbtn" id="langbtn">EN</button>
    <button class="iconbtn" id="guidebtn">?</button>
  </header>

  <div class="pad">
    <!-- beurt -->
    <div class="turnbar">
      <div class="who">
        <div class="lab" id="turnlab">Aan de beurt</div>
        <div class="name" id="turnname">-</div>
        <div class="round" id="roundlab">Ronde 1</div>
      </div>
      <button class="bigbtn" id="nextbtn">Volgende ▶</button>
    </div>

    <!-- toevoegen -->
    <div class="section-ttl" id="addttl">Deelnemer toevoegen</div>
    <div class="addrow">
      <input class="name" id="in-name" placeholder="Naam (held of monster)" autocomplete="off">
      <input class="ini" id="in-init" inputmode="numeric" placeholder="Init">
      <button class="d20" id="rollinit" title="Gooi d20">🎲 d20</button>
      <input class="hp" id="in-hp" inputmode="numeric" placeholder="HP">
      <button class="add" id="addbtn">+ Toevoegen</button>
    </div>

    <!-- lijst -->
    <div class="section-ttl" id="listttl">Volgorde</div>
    <div id="list"></div>
    <div class="empty" id="empty">Nog niemand. Voeg deelnemers toe en gooi initiatief.</div>
  </div>
</div>

<footer>
  <button class="reset" id="resetbtn">Nieuw gevecht</button>
  <span class="sp"></span>
  <span class="ver">v1.0</span>
  <button class="donate" id="donatebtn">♥ Donatie</button>
</footer>

<!-- gids -->
<div class="modal" id="guide">
  <div class="sheet">
    <div id="guidebody"></div>
    <button class="close" id="guideclose">Sluiten</button>
  </div>
</div>

  var state = { round:1, currentId:null, combatants:[] };

  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  load();

  var nextId = 1;
  state.combatants.forEach(function(c){ if(c.id>=nextId) nextId=c.id+1; });

  function sorted(){
    return state.combatants.slice().sort(function(a,b){
      if(b.init!==a.init) return b.init-a.init;
      return (a.name||"").localeCompare(b.name||"");
    });
  }

  function addCombatant(){

    if(!name){ document.getElementById("in-name").focus(); return; }
    if(isNaN(init)) init=0;
    if(isNaN(hp)) hp=0;
    state.combatants.push({id:nextId++, name:name, init:init, hp:hp, maxhp:hp, note:""});
    if(state.currentId===null){ var s=sorted(); if(s.length) state.currentId=s[0].id; }
    document.getElementById("in-name").value="";
    document.getElementById("in-init").value="";
    document.getElementById("in-hp").value="";
    document.getElementById("in-name").focus();
    save(); render();
  }
  function removeCombatant(id){
    var s=sorted(), idx=s.findIndex(function(c){return c.id===id;});
    state.combatants=state.combatants.filter(function(c){return c.id!==id;});
    if(state.currentId===id){
      var ns=sorted();
      state.currentId = ns.length ? ns[Math.min(idx,ns.length-1)].id : null;
    }
    save(); render();
  }
  function changeHp(id,delta){
    var c=state.combatants.find(function(x){return x.id===id;});
    if(!c) return;
    c.hp += delta;
    if(c.maxhp && c.hp>c.maxhp) c.hp=c.maxhp;
    if(c.hp<0) c.hp=0;
    save(); render();
  }
  function setNote(id,val){
    var c=state.combatants.find(function(x){return x.id===id;});
    if(c){ c.note=val; save(); }
  }
  function nextTurn(){
    var s=sorted();
    if(!s.length) return;
    var i=s.findIndex(function(c){return c.id===state.currentId;});
    if(i<0) i=-1;
    var ni=i+1;
    if(ni>=s.length){ ni=0; state.round++; }
    state.currentId=s[ni].id;
    save(); render();
  }
  function newCombat(){
    if(!state.combatants.length || confirm(t("Weet je het zeker? Dit wist alle deelnemers."))){
      state={round:1,currentId:null,combatants:[]}; save(); render();
    }
  }

  // ---------- render ----------
  function render(){
    applyStatic();
    var s=sorted();
    var cur=s.find(function(c){return c.id===state.currentId;});
    document.getElementById("turnname").textContent = cur ? cur.name : "-";
    document.getElementById("roundlab").textContent = t("Ronde")+" "+state.round;

    var list=document.getElementById("list");
    list.innerHTML="";
    document.getElementById("empty").style.display = s.length ? "none" : "block";

    s.forEach(function(c){
      var down = c.hp<=0 && (c.maxhp>0);
      var card=document.createElement("div");
      card.className="card"+(c.id===state.currentId?" active":"")+(down?" down":"");
      var badge = down ? '<div class="badge">'+t("Uitgeschakeld")+'</div>' : '';
      card.innerHTML=
        '<div class="top">'+
          '<div class="ini">'+(isFinite(c.init)?c.init:0)+'</div>'+
          '<div class="nm"><div class="n"></div>'+badge+'</div>'+
          '<div class="hpbox"><div class="hp">'+c.hp+'</div>'+
            (c.maxhp?'<div class="mx">/ '+c.maxhp+'</div>':'')+'</div>'+
          '<button class="del" title="x">✕</button>'+
        '</div>'+
        '<div class="hprow">'+
          '<input class="amt" inputmode="numeric" value="1">'+
          '<button class="dmg">– '+t("Schade")+'</button>'+
          '<button class="heal">+ '+t("Genees")+'</button>'+
        '</div>'+
        '<div class="noterow"><input class="note" placeholder="'+t("Notitie (bijv. vergiftigd)")+'"></div>';
      card.querySelector(".n").textContent=c.name;
      var note=card.querySelector(".note"); note.value=c.note||"";
      var amt=card.querySelector(".amt");
      function amount(){ var v=parseInt(amt.value,10); return (isNaN(v)||v<0)?1:v; }
      card.querySelector(".dmg").addEventListener("click",function(){ changeHp(c.id,-amount()); });
      card.querySelector(".heal").addEventListener("click",function(){ changeHp(c.id,+amount()); });
      card.querySelector(".del").addEventListener("click",function(){ removeCombatant(c.id); });
      note.addEventListener("change",function(){ setNote(c.id,note.value); });
      list.appendChild(card);
    });
  }

  function applyStatic(){
    document.documentElement.lang = lang;
    document.getElementById("langbtn").textContent = lang==="nl" ? "EN" : "NL";
    document.getElementById("turnlab").textContent = t("Aan de beurt");
    document.getElementById("nextbtn").textContent = t("Volgende")+" ▶";
    document.getElementById("addttl").textContent = t("Deelnemer toevoegen");
    document.getElementById("in-name").placeholder = t("Naam (held of monster)");
    document.getElementById("in-init").placeholder = t("Init");
    document.getElementById("in-hp").placeholder = t("HP");
    document.getElementById("addbtn").textContent = t("+ Toevoegen");
    document.getElementById("rollinit").title = t("Gooi d20");
    document.getElementById("listttl").textContent = t("Volgorde");
    document.getElementById("empty").textContent = t("Nog niemand. Voeg deelnemers toe en gooi initiatief.");
    document.getElementById("resetbtn").textContent = t("Nieuw gevecht");
    document.getElementById("donatebtn").textContent = "♥ "+t("Donatie");
    document.getElementById("guideclose").textContent = t("Sluiten");
  }

  // ---------- events ----------
  document.getElementById("addbtn").addEventListener("click", addCombatant);
  document.getElementById("in-hp").addEventListener("keydown", function(e){ if(e.key==="Enter") addCombatant(); });
  document.getElementById("in-init").addEventListener("keydown", function(e){ if(e.key==="Enter"){ document.getElementById("in-hp").focus(); } });
  document.getElementById("nextbtn").addEventListener("click", nextTurn);
  document.getElementById("resetbtn").addEventListener("click", newCombat);
  document.getElementById("rollinit").addEventListener("click", function(){
    document.getElementById("in-init").value = (Math.floor(Math.random()*20)+1);
  });
  document.getElementById("donatebtn").addEventListener("click", function(){ window.open(DONATE,"_blank"); });
  document.getElementById("langbtn").addEventListener("click", function(){
    lang = (lang==="nl") ? "en" : "nl";
    localStorage.setItem("dravetable_lang", lang);
    render();
  });
  document.getElementById("guidebtn").addEventListener("click", function(){
    document.getElementById("guidebody").innerHTML =
      (lang==="nl") ? GUIDE_NL : T.en["guide_html"];
    document.getElementById("guide").classList.add("on");
  });
  document.getElementById("guideclose").addEventListener("click", function(){
    document.getElementById("guide").classList.remove("on");
  });
  document.getElementById("guide").addEventListener("click", function(e){
    if(e.target===this) this.classList.remove("on");
  });

  var GUIDE_NL =
    "<h2>DraveTable - Snelgids</h2>"+
    "<p>Een gevechtshulpje voor de spelleider. Houdt de initiatief-volgorde, de beurten en de HP bij.</p>"+
    "<p><b>Deelnemers toevoegen</b>: typ een naam, hun initiatief-getal en HP, en tik op '+ Toevoegen'. "+
    "Met de d20-knop gooi je initiatief. De lijst zet zichzelf op volgorde, hoog naar laag.</p>"+
    "<p><b>Beurten</b>: wie aan de beurt is, is gemarkeerd. Tik op 'Volgende' om door te gaan; "+
    "na de laatste loopt de rondeteller op.</p>"+
    "<p><b>HP</b>: typ een aantal en tik 'Schade' of 'Genees'. Bij 0 HP wordt iemand als "+
    "'Uitgeschakeld' getoond. Met de X haal je iemand weg.</p>"+
    "<p>Alles wordt op je telefoon bewaard, dus de browser sluiten verliest je gevecht niet. "+
    "'Nieuw gevecht' maakt 'm leeg.</p>"+
    "<p>Tip: zet deze pagina op je beginscherm om 'm als een app te gebruiken, ook offline.</p>"+
    "<p>Vragen? service@dravenlock.nl</p>";

  render();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
